version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: strapi_dev
      POSTGRES_PASSWORD: strapi_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi_dev -d portfolio_dev"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: